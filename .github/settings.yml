repository:
  name: thryftverse-upgrade
  description: ThryftVerse — flagship mobile marketplace
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  default_branch: main

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "Frontend CI / typecheck"
          - "Frontend CI / lint"
          - "Frontend CI / test"
          - "Backend CI / api"
          - "Backend CI / key-service"
      enforce_admins: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 1
      restrictions: null
  - name: develop
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "Frontend CI / typecheck"
          - "Backend CI / api"
      enforce_admins: false
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        required_approving_review_count: 1
      restrictions: null
