name: OTA Staged Rollout

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel (staging/canary/production)'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - canary
          - production
      message:
        description: 'Update message'
        required: true
      rollout_percentage:
        description: 'Rollout percentage (1, 10, 50, 100)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '10'
          - '50'
          - '100'

permissions:
  contents: read

concurrency:
  group: ota-staged-rollout-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish-update:
    name: Publish EAS Update (${{ inputs.rollout_percentage }}%)
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'production' && 'production' || (inputs.channel == 'canary' && 'canary' || 'staging') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Verify release configuration (F18)
        # Fail-closed: an OTA publish without the signing key produces an
        # unsigned update — stop here rather than shipping it.
        working-directory: frontend
        run: npm run check:release-config -- ota
        env:
          EXPO_PUBLIC_OTA_CODE_SIGNING_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}

      - name: Materialize OTA signing key
        env:
          OTA_CODE_SIGNING_PRIVATE_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_CODE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::OTA signing private key secret is required (EXPO_OTA_CODE_SIGNING_PRIVATE_KEY) — cannot produce a signed OTA update."
            exit 1
          fi
          key_path="$RUNNER_TEMP/ota-private-key.pem"
          # Restrictive permissions from creation (umask 077) — the key never
          # exists world/group-readable between write and chmod.
          (umask 077; printf '%s' "$OTA_CODE_SIGNING_PRIVATE_KEY" > "$key_path")
          echo "OTA_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Publish EAS Update (${{ inputs.rollout_percentage }}%)
        working-directory: frontend
        run: |
          eas update \
            --channel "$OTA_CHANNEL" \
            --private-key-path "$OTA_PRIVATE_KEY_PATH" \
            --message "$OTA_MESSAGE" \
            --rollout-percentage "$ROLLOUT_PERCENTAGE"
        env:
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          OTA_CHANNEL: ${{ inputs.channel }}
          OTA_MESSAGE: ${{ inputs.message }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}

      - name: Notify rollout published
        if: success()
        env:
          OTA_CHANNEL: ${{ inputs.channel }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          echo "::notice::OTA update published to $OTA_CHANNEL at $ROLLOUT_PERCENTAGE% rollout. Monitor EAS Observe before progressing."

      - name: Scrub OTA signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ota-private-key.pem"

      - name: Failure notification
        if: failure()
        env:
          OTA_CHANNEL: ${{ inputs.channel }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"OTA staged rollout FAILED for channel $OTA_CHANNEL\"}" \
            "${{ secrets.ALERTING_WEBHOOK_URL }}" || true
