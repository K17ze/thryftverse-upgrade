name: Staging Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-build-gates:
    name: Pre-build quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Run expo-doctor
        run: npx expo-doctor
        working-directory: frontend

      - name: SSL pin validation
        run: node scripts/validate-ssl-pins.mjs
        working-directory: frontend

  build-and-deploy:
    name: EAS Build + Update (preview profile → staging channel)
    needs: pre-build-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build ${{ matrix.platform }} (preview profile)
        working-directory: frontend
        run: eas build --platform ${{ matrix.platform }} --non-interactive --profile preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify release configuration (F18)
        # Fail-closed: staging clients enforce OTA code signing too, so an
        # unsigned staging update would be rejected on-device.
        working-directory: frontend
        run: npm run check:release-config -- ota
        env:
          EXPO_PUBLIC_OTA_CODE_SIGNING_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}

      - name: Materialize OTA signing key
        env:
          OTA_CODE_SIGNING_PRIVATE_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_CODE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::OTA signing private key secret is required (EXPO_OTA_CODE_SIGNING_PRIVATE_KEY)."
            exit 1
          fi
          key_path="$RUNNER_TEMP/ota-private-key.pem"
          printf '%s' "$OTA_CODE_SIGNING_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "OTA_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Publish OTA update to staging channel
        working-directory: frontend
        run: eas update --channel staging --non-interactive --private-key-path "$OTA_PRIVATE_KEY_PATH" --message "staging deploy (${{ github.sha }})"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  post-deploy-smoke:
    name: Post-deploy smoke tests (staging)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: backend/api

      - name: Wait for OTA update propagation
        run: |
          echo "Waiting 30s for OTA update to propagate to staging clients..."
          sleep 30

      - name: Lightweight health + API smoke test
        run: node scripts/post-deploy-smoke.mjs
        working-directory: backend
        env:
          BASE_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.thryftverse.com' }}

      - name: Commerce flow smoke test
        run: npm run smoke:commerce
        working-directory: backend/api
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.thryftverse.com' }}

      - name: Co-own flow smoke test
        run: npm run smoke:coown
        working-directory: backend/api
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.thryftverse.com' }}

      - name: Profile flow smoke test
        run: npm run smoke:profile
        working-directory: backend/api
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.thryftverse.com' }}

  notify-failure:
    name: Notify on failure
    needs: [build-and-deploy, post-deploy-smoke]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Slack/Discord notification
        env:
          ALERTING_WEBHOOK_URL: ${{ secrets.ALERTING_WEBHOOK_URL }}
        run: |
          $webhook = "${env:ALERTING_WEBHOOK_URL}"
          if ([string]::IsNullOrWhiteSpace($webhook)) {
            Write-Host "ALERTING_WEBHOOK_URL secret not set — skipping notification"
            exit 0
          }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $payload = @{
            content = "❌ **Staging Deploy FAILED** in $env:GITHUB_REPOSITORY`nBranch: $env:GITHUB_REF`nRun: $runUrl"
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $webhook -Method Post -Body $payload -ContentType "application/json"
          Write-Host "Failure notification sent"
        shell: pwsh
