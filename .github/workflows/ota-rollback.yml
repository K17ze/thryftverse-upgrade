name: OTA Rollback

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - canary
          - production
      method:
        description: 'Rollback method'
        required: true
        default: 'rollback'
        type: choice
        options:
          - rollback
          - republish

permissions:
  contents: read

# One rollback per channel at a time — overlapping rollbacks on the same
# channel can interleave branch state.
concurrency:
  group: ota-rollback-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  rollback:
    name: OTA Rollback (${{ inputs.method }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'production' && 'production' || (inputs.channel == 'canary' && 'canary' || 'staging') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Materialize OTA signing key
        # Code-signed projects require --private-key-path on update:rollback.
        if: inputs.method == 'rollback'
        env:
          OTA_CODE_SIGNING_PRIVATE_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_CODE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::OTA signing private key secret is required (EXPO_OTA_CODE_SIGNING_PRIVATE_KEY)."
            exit 1
          fi
          key_path="$RUNNER_TEMP/ota-private-key.pem"
          # Restrictive permissions from creation (umask 077), not a chmod
          # after the fact — the key never exists world/group-readable.
          (umask 077; printf '%s' "$OTA_CODE_SIGNING_PRIVATE_KEY" > "$key_path")
          echo "OTA_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Rollback to embedded bundle
        if: inputs.method == 'rollback'
        env:
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          OTA_CHANNEL: ${{ inputs.channel }}
        run: eas update:rollback --branch "$OTA_CHANNEL" --private-key-path "$OTA_PRIVATE_KEY_PATH"

      - name: Republish previous update
        if: inputs.method == 'republish'
        env:
          OTA_CHANNEL: ${{ inputs.channel }}
        run: |
          # Republish of a specific update group is owned by the Release
          # Train workflow (signed, and gated by production approval). This
          # workflow cannot perform it — fail loudly instead of reporting a
          # rollback that never happened.
          echo "::error::Republish is not executed by this workflow. Dispatch 'Release Train' with channel=$OTA_CHANNEL and rollback_update_id=<UPDATE_GROUP_ID> — that path is signed and passes through the production-approval gate."
          exit 1

      - name: Notify rollback executed
        if: success() && inputs.method == 'rollback'
        env:
          OTA_CHANNEL: ${{ inputs.channel }}
        run: |
          echo "::notice::OTA rollback (rollback to embedded bundle) executed on $OTA_CHANNEL channel."

      - name: Scrub OTA signing key
        # Key material must not outlive the job — always() so it runs even
        # when the rollback step fails or is skipped.
        if: always()
        run: rm -f "$RUNNER_TEMP/ota-private-key.pem"

      - name: Failure notification
        if: failure()
        env:
          OTA_CHANNEL: ${{ inputs.channel }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERTING_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"OTA rollback FAILED on channel $OTA_CHANNEL\"}" \
            "$ALERT_WEBHOOK_URL" || true
