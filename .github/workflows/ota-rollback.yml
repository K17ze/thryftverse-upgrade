name: OTA Rollback

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - canary
          - production
      method:
        description: 'Rollback method'
        required: true
        default: 'rollback'
        type: choice
        options:
          - rollback
          - republish

permissions:
  contents: read

jobs:
  rollback:
    name: OTA Rollback (${{ inputs.method }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'production' && 'production' || (inputs.channel == 'canary' && 'canary' || 'staging') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Materialize OTA signing key
        # Code-signed projects require --private-key-path on update:rollback.
        if: inputs.method == 'rollback'
        env:
          OTA_CODE_SIGNING_PRIVATE_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_CODE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::OTA signing private key secret is required (EXPO_OTA_CODE_SIGNING_PRIVATE_KEY)."
            exit 1
          fi
          key_path="$RUNNER_TEMP/ota-private-key.pem"
          printf '%s' "$OTA_CODE_SIGNING_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "OTA_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Rollback to embedded bundle
        if: inputs.method == 'rollback'
        run: eas update:rollback --branch ${{ inputs.channel }} --private-key-path "$OTA_PRIVATE_KEY_PATH"
        env:
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}

      - name: Republish previous update
        if: inputs.method == 'republish'
        run: |
          echo "::warning::Republish of a specific update group is owned by the Release Train workflow."
          echo "Dispatch 'Release Train' with channel=${{ inputs.channel }} and rollback_update_id=<UPDATE_GROUP_ID> —"
          echo "that path is signed and passes through the production-approval gate."

      - name: Notify rollback executed
        if: success()
        run: |
          echo "::notice::OTA rollback (${{ inputs.method }}) executed on ${{ inputs.channel }} channel."

      - name: Failure notification
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"OTA rollback FAILED on channel ${{ inputs.channel }}\"}" \
            ${{ secrets.ALERTING_WEBHOOK_URL }} || true
