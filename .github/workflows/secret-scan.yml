name: Secret Scan

# Gitleaks over the full history — a committed secret is caught at PR time,
# not after the leak ships. Pinned action + pinned gitleaks version so the
# scan surface itself cannot drift.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  # GITLEAKS_ENABLE_COMMENTS posts PR annotations — needs write on pull-requests.
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned to the immutable commit for v2.3.7 — a security gate cannot
        # float on a mutable tag.
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3
        env:
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
