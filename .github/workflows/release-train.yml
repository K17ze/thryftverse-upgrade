name: Release Train

on:
  push:
    branches:
      - develop
      - "release/*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      rollback_update_id:
        description: "EAS Update group ID to re-publish (rollback mode, leave empty for normal release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-channel:
    name: Determine release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.set-channel.outputs.channel }}
      profile: ${{ steps.set-channel.outputs.profile }}
      is_rollback: ${{ steps.set-channel.outputs.is_rollback }}
      is_production: ${{ steps.set-channel.outputs.is_production }}
    steps:
      - id: set-channel
        # Inputs and refs are bound through env — never interpolated into
        # run: — so a crafted ref name or dispatch input cannot inject shell.
        env:
          ROLLBACK_UPDATE_ID: ${{ inputs.rollback_update_id }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ -n "$ROLLBACK_UPDATE_ID" ]; then
            echo "is_rollback=true" >> "$GITHUB_OUTPUT"
            echo "channel=$INPUT_CHANNEL" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_CHANNEL" != "" ]; then
            echo "is_rollback=false" >> "$GITHUB_OUTPUT"
            echo "channel=$INPUT_CHANNEL" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_CHANNEL" = "production" ]; then
              echo "profile=production" >> "$GITHUB_OUTPUT"
              echo "is_production=true" >> "$GITHUB_OUTPUT"
            elif [ "$INPUT_CHANNEL" = "staging" ]; then
              echo "profile=preview" >> "$GITHUB_OUTPUT"
              echo "is_production=false" >> "$GITHUB_OUTPUT"
            else
              echo "profile=development" >> "$GITHUB_OUTPUT"
              echo "is_production=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GIT_REF" == "refs/heads/develop" ]]; then
            echo "is_rollback=false" >> "$GITHUB_OUTPUT"
            echo "channel=development" >> "$GITHUB_OUTPUT"
            echo "profile=development" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GIT_REF" == refs/heads/release/* ]]; then
            echo "is_rollback=false" >> "$GITHUB_OUTPUT"
            echo "channel=staging" >> "$GITHUB_OUTPUT"
            echo "profile=preview" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "is_rollback=false" >> "$GITHUB_OUTPUT"
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rollback=false" >> "$GITHUB_OUTPUT"
            echo "channel=development" >> "$GITHUB_OUTPUT"
            echo "profile=development" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi

  production-approval-gate:
    name: Production approval gate
    needs: determine-channel
    runs-on: ubuntu-latest
    # Applies to every production release — including rollback republishes.
    # Non-production runs SKIP this job; downstream jobs treat a skipped gate
    # as "not required" and a failed/cancelled gate as "rejected".
    if: needs.determine-channel.outputs.is_production == 'true'
    environment: production-approval
    steps:
      - name: Await manual approval
        run: |
          echo "::notice::Production release requires manual approval."
          echo "Approve this deployment in the GitHub Actions environment 'production-approval'."
          echo "Once approved, the build and publish jobs will proceed."

  build-ios:
    name: EAS Build iOS
    needs: [determine-channel, production-approval-gate]
    # always() is required: on non-production runs the approval gate is
    # SKIPPED, and a job whose `needs` includes a skipped job is itself
    # skipped unless its `if` opts out of the default success() predicate.
    # Gate semantics: 'skipped' = not required (non-prod), 'success' =
    # approved, anything else = rejected → build must not run.
    if: >-
      always() &&
      needs.determine-channel.result == 'success' &&
      needs.determine-channel.outputs.is_rollback != 'true' &&
      (needs.production-approval-gate.result == 'success' ||
       needs.production-approval-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.determine-channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build iOS
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          BUILD_PROFILE: ${{ needs.determine-channel.outputs.profile }}
        run: eas build --profile "$BUILD_PROFILE" --platform ios --non-interactive

  build-android:
    name: EAS Build Android
    needs: [determine-channel, production-approval-gate]
    if: >-
      always() &&
      needs.determine-channel.result == 'success' &&
      needs.determine-channel.outputs.is_rollback != 'true' &&
      (needs.production-approval-gate.result == 'success' ||
       needs.production-approval-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.determine-channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          BUILD_PROFILE: ${{ needs.determine-channel.outputs.profile }}
        run: eas build --profile "$BUILD_PROFILE" --platform android --non-interactive

  publish-update:
    name: Publish EAS Update
    needs: [determine-channel, production-approval-gate, build-ios, build-android]
    # Every publish path — normal release AND rollback republish — flows
    # through the approval gate result. 'skipped' means the gate was not
    # required (non-production); 'success' means it was approved. A failed or
    # cancelled gate blocks publishing entirely.
    if: >-
      always() &&
      needs.determine-channel.result == 'success' &&
      (needs.production-approval-gate.result == 'success' ||
       needs.production-approval-gate.result == 'skipped') &&
      (needs.determine-channel.outputs.is_rollback == 'true' ||
       (needs.build-ios.result == 'success' && needs.build-android.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.determine-channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify release configuration (F18)
        # Fail-closed: an OTA publish without the signing key produces an
        # unsigned update — stop here rather than shipping it.
        working-directory: frontend
        run: npm run check:release-config -- ota
        env:
          # check-release-config.mjs reads EXPO_PUBLIC_OTA_CODE_SIGNING_KEY;
          # prefer the correctly-named private secret, fall back to the
          # legacy EXPO_PUBLIC_* name still documented in eas.json.
          EXPO_PUBLIC_OTA_CODE_SIGNING_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}
      - name: Materialize OTA signing key
        # The private key is a publish-time input to `eas update` — written
        # to a runner-local file and passed via --private-key-path. It is
        # deliberately NOT exposed to the publish steps' env: EXPO_PUBLIC_*
        # variables are inlined into the update bundle by expo export, which
        # would ship the private key to every client. Preferred secret name
        # is EXPO_OTA_CODE_SIGNING_PRIVATE_KEY (no EXPO_PUBLIC_ prefix);
        # EXPO_PUBLIC_OTA_CODE_SIGNING_KEY is accepted for backwards
        # compatibility only — never set it on a step that runs expo export.
        env:
          OTA_CODE_SIGNING_PRIVATE_KEY: ${{ secrets.EXPO_OTA_CODE_SIGNING_PRIVATE_KEY || secrets.EXPO_PUBLIC_OTA_CODE_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_CODE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::OTA signing private key secret is required (EXPO_OTA_CODE_SIGNING_PRIVATE_KEY) — cannot produce a signed OTA update."
            exit 1
          fi
          key_path="$RUNNER_TEMP/ota-private-key.pem"
          # Restrictive permissions from creation (umask 077) — the key never
          # exists world/group-readable between write and chmod.
          (umask 077; printf '%s' "$OTA_CODE_SIGNING_PRIVATE_KEY" > "$key_path")
          echo "OTA_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Rollback — re-publish previous update
        if: needs.determine-channel.outputs.is_rollback == 'true'
        working-directory: frontend
        run: |
          # eas-cli republish selects by --group / --branch / --channel
          # (mutually exclusive) — there is no --update-id flag. The input
          # carries the update GROUP id; --channel must not be combined with
          # it. The destination stays on the group's existing branch.
          eas update:republish \
            --group "$ROLLBACK_UPDATE_ID" \
            --private-key-path "$OTA_PRIVATE_KEY_PATH" \
            --message "rollback: re-publishing update $ROLLBACK_UPDATE_ID" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          ROLLBACK_UPDATE_ID: ${{ inputs.rollback_update_id }}
      - name: Publish new update
        if: needs.determine-channel.outputs.is_rollback != 'true'
        working-directory: frontend
        run: |
          eas update \
            --channel "$OTA_CHANNEL" \
            --private-key-path "$OTA_PRIVATE_KEY_PATH" \
            --message "$OTA_CHANNEL: $GIT_REF_NAME ($GIT_SHA)" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          OTA_CHANNEL: ${{ needs.determine-channel.outputs.channel }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
      - name: Scrub OTA signing key
        # Key material must not outlive the job — always() so it runs even
        # when the publish fails or is skipped.
        if: always()
        run: rm -f "$RUNNER_TEMP/ota-private-key.pem"

  tag-release:
    name: Tag semantic version
    needs: [determine-channel, publish-update]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            **Channel:** ${{ needs.determine-channel.outputs.channel }}
            **Commit:** ${{ github.sha }}

            ### EAS Build
            - iOS profile: ${{ needs.determine-channel.outputs.profile }}
            - Android profile: ${{ needs.determine-channel.outputs.profile }}
            - iOS Xcode image: latest-xcode26 (pinned in eas.json)

            ### EAS Update
            Published to the `${{ needs.determine-channel.outputs.channel }}` channel.

            ### Approval
            Production releases require manual approval via the `production-approval` GitHub environment.
          draft: false
          prerelease: ${{ needs.determine-channel.outputs.channel != 'production' }}
