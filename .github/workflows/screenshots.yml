name: Screenshots

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"
      - "frontend/.maestro/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to capture"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
          - both

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-flight-gates:
    name: Pre-flight quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Design token lint
        run: npm run lint:design-tokens
        working-directory: frontend

  screenshots-ios:
    name: iOS screenshots (Maestro)
    needs: pre-flight-gates
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_ID: com.thryftverse.app
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.tools" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS dev client
        working-directory: frontend
        run: eas build --platform ios --profile development-simulator --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download and install iOS build
        working-directory: frontend
        run: |
          BUILD_ID=$(eas build:list --platform ios --profile development-simulator --json --limit=1 | jq -r '.[0].id')
          eas build:download "$BUILD_ID" --output build.tar.gz
          mkdir -p build
          tar -xzf build.tar.gz -C build

      - name: Boot iOS simulator
        run: |
          SIM_ID=$(xcrun simctl create "ThryftVerseScreenshots" "iPhone 15" "iOS17.4")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID"
          sleep 15

      - name: Install app on simulator
        run: |
          xcrun simctl install "$SIM_ID" frontend/build/*.app

      - name: Run Maestro screenshot flows
        working-directory: frontend
        run: |
          mkdir -p .maestro/screenshots
          for flow in .maestro/flows/*.yaml; do
            maestro test "$flow" --env APP_ID=$APP_ID || true
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios-${{ github.sha }}
          path: frontend/.maestro/screenshots/**
          if-no-files-found: warn
          retention-days: 30

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "$SIM_ID" || true
          xcrun simctl delete "$SIM_ID" || true

  screenshots-android:
    name: Android screenshots (Maestro)
    needs: pre-flight-gates
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ID: com.thryftverse.app
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.tools" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android dev client
        working-directory: frontend
        run: eas build --platform android --profile development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download Android build
        working-directory: frontend
        run: |
          BUILD_ID=$(eas build:list --platform android --profile development --json --limit=1 | jq -r '.[0].id')
          eas build:download "$BUILD_ID" --output app.apk

      - name: Boot Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r frontend/app.apk
            cd frontend && mkdir -p .maestro/screenshots
            for flow in .maestro/flows/*.yaml; do
              maestro test "$flow" --env APP_ID=$APP_ID || true
            done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-${{ github.sha }}
          path: frontend/.maestro/screenshots/**
          if-no-files-found: warn
          retention-days: 30
