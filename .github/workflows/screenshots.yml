name: Screenshots

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  schedule:
    # Nightly at 03:00 UTC — catches drift from dependencies, OTA updates, OS changes
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to capture"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
          - both

permissions:
  contents: write
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'frontend/**'
              - '.github/workflows/screenshots.yml'
              - 'frontend/.maestro/**'

  pre-flight-gates:
    name: Pre-flight quality gates
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Design token lint
        run: npm run lint:design-tokens
        working-directory: frontend
      - name: Visual release gates lint
        run: npm run check:visual-gates
        working-directory: frontend

  screenshots-ios:
    name: iOS screenshots — ${{ matrix.device }} (${{ matrix.width }})
    needs: [changes, pre-flight-gates]
    if: (needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both')
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "iPhone 15 Pro"
            sim_type: "iPhone 15 Pro"
            device_slug: "iphone15pro"
            width: regular
          - device: "iPhone SE (3rd generation)"
            sim_type: "iPhone SE (3rd generation)"
            device_slug: "iphonese"
            width: compact
    env:
      APP_ID: com.thryftverse.app
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_MOCK_MODE: fixture-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.tools" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS dev client
        working-directory: frontend
        run: |
          eas build \
            --platform ios \
            --profile screenshots \
            --message "screenshots:${GITHUB_SHA}" \
            --wait \
            --json > eas-build-ios.json
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end // empty' eas-build-ios.json)
          BUILD_SHA=$(jq -r 'if type == "array" then .[0].gitCommitHash else .gitCommitHash end // empty' eas-build-ios.json)
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end // empty' eas-build-ios.json)
          test -n "$BUILD_ID"
          test "$BUILD_SHA" = "$GITHUB_SHA"
          test -n "$BUILD_URL"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "EAS_BUILD_URL=$BUILD_URL" >> "$GITHUB_ENV"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download and install iOS build
        working-directory: frontend
        run: |
          curl --fail --location --retry 3 "$EAS_BUILD_URL" --output build.tar.gz
          mkdir -p build
          tar -xzf build.tar.gz -C build
          test -n "$(find build -maxdepth 2 -name '*.app' -print -quit)"

      - name: Boot iOS simulator (${{ matrix.device }})
        run: |
          SIM_ID=$(xcrun simctl create "ThryftVerseScreenshots" "${{ matrix.sim_type }}" "iOS17.4")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID"
          sleep 15

      - name: Configure deterministic simulator state
        run: |
          # Fixed status bar — 9:41, full wifi, full cellular, charged battery
          xcrun simctl status_bar "$SIM_ID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100

          # Reduce motion — eliminates animation non-determinism
          xcrun simctl ui "$SIM_ID" reduce_motion yes

      - name: Install app on simulator
        run: |
          xcrun simctl install "$SIM_ID" frontend/build/*.app

      - name: Run Maestro visual regression matrix
        working-directory: frontend
        run: |
          mkdir -p .maestro/screenshots

          capture_variant() {
            local theme="$1"
            local font_scale="$2"
            local label="$3"

            xcrun simctl ui "$SIM_ID" appearance "$theme"
            case "$font_scale" in
              100) xcrun simctl ui "$SIM_ID" content_size default ;;
              130) xcrun simctl ui "$SIM_ID" content_size extra-extra-large ;;
              200) xcrun simctl ui "$SIM_ID" content_size accessibility-extra-extra-extra-large ;;
            esac
            sleep 2

            maestro test .maestro/flows/visualRegressionMatrix.yaml \
              --env APP_ID=$APP_ID \
              --env PLATFORM=ios \
              --env DEVICE=${{ matrix.device_slug }} \
              --env THEME="$theme" \
              --env FONT_SCALE="$font_scale" \
              --env VISUAL_MODE=capture \
              --test-output-dir=".maestro/screenshots/${label}"
          }

          capture_variant light 100 ios-${{ matrix.device_slug }}-light-100
          capture_variant dark  100 ios-${{ matrix.device_slug }}-dark-100
          capture_variant light 130 ios-${{ matrix.device_slug }}-light-130
          capture_variant light 200 ios-${{ matrix.device_slug }}-light-200

          ACTUAL_SCREENSHOTS=$(find .maestro/screenshots -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Captured $ACTUAL_SCREENSHOTS screenshots"
          test "$ACTUAL_SCREENSHOTS" -gt 0

      - name: Run reg-suit visual regression comparison
        working-directory: frontend
        run: |
          mkdir -p src/__tests__/__screenshots__/actual
          cp -r .maestro/screenshots/*.png src/__tests__/__screenshots__/actual/ 2>/dev/null || true
          if [ -d src/__tests__/__screenshots__/expected ] && \
             [ "$(find src/__tests__/__screenshots__/expected -name '*.png' | wc -l)" -gt 0 ]; then
            npx reg-suit run
          else
            echo "No expected baselines found — skipping reg-suit compare."
            echo "Run 'npm run visual:capture && npm run visual:approve' to seed baselines."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios-${{ matrix.device_slug }}-${{ github.sha }}
          path: |
            frontend/.maestro/screenshots/**
            frontend/src/__tests__/__screenshots__/diff/**
            frontend/report.html
            frontend/eas-build-ios.json
          if-no-files-found: warn
          retention-days: 30

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "$SIM_ID" || true
          xcrun simctl delete "$SIM_ID" || true

  screenshots-android:
    name: Android screenshots — ${{ matrix.device }} (${{ matrix.width }})
    needs: [changes, pre-flight-gates]
    if: (needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "Pixel 8"
            profile: "pixel_8"
            device_slug: "pixel8"
            width: regular
          - device: "Pixel 5"
            profile: "pixel_5"
            device_slug: "pixel5"
            width: compact
    env:
      APP_ID: com.thryftverse.app
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_MOCK_MODE: fixture-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.tools" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android dev client
        working-directory: frontend
        run: |
          eas build \
            --platform android \
            --profile screenshots \
            --message "screenshots:${GITHUB_SHA}" \
            --wait \
            --json > eas-build-android.json
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end // empty' eas-build-android.json)
          BUILD_SHA=$(jq -r 'if type == "array" then .[0].gitCommitHash else .gitCommitHash end // empty' eas-build-android.json)
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end // empty' eas-build-android.json)
          test -n "$BUILD_ID"
          test "$BUILD_SHA" = "$GITHUB_SHA"
          test -n "$BUILD_URL"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "EAS_BUILD_URL=$BUILD_URL" >> "$GITHUB_ENV"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download Android build
        working-directory: frontend
        run: |
          curl --fail --location --retry 3 "$EAS_BUILD_URL" --output app.apk
          test -s app.apk

      - name: Boot Android emulator and run visual regression matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: |
            adb install -r frontend/app.apk
            cd frontend && mkdir -p .maestro/screenshots

            # Deterministic emulator state — reduce motion eliminates
            # animation non-determinism in screenshots
            adb shell settings put secure reduce_motion 1
            adb shell settings put secure window_animation_scale 0.0
            adb shell settings put secure transition_animation_scale 0.0

            capture_variant() {
              local theme="$1"
              local font_scale="$2"
              local label="$3"

              if [ "$theme" = "dark" ]; then
                adb shell cmd uimode night yes
              else
                adb shell cmd uimode night no
              fi
              adb shell settings put system font_scale "$font_scale"
              sleep 2

              maestro test .maestro/flows/visualRegressionMatrix.yaml \
                --env APP_ID=$APP_ID \
                --env PLATFORM=android \
                --env DEVICE=${{ matrix.device_slug }} \
                --env THEME="$theme" \
                --env FONT_SCALE="$(echo "$font_scale" | tr '.' '')" \
                --env VISUAL_MODE=capture \
                --test-output-dir=".maestro/screenshots/${label}"
            }

            capture_variant light 1.0 android-${{ matrix.device_slug }}-light-100
            capture_variant dark  1.0 android-${{ matrix.device_slug }}-dark-100
            capture_variant light 1.3 android-${{ matrix.device_slug }}-light-130
            capture_variant light 2.0 android-${{ matrix.device_slug }}-light-200

            ACTUAL_SCREENSHOTS=$(find .maestro/screenshots -type f -name '*.png' | wc -l | tr -d ' ')
            echo "Captured $ACTUAL_SCREENSHOTS screenshots"
            test "$ACTUAL_SCREENSHOTS" -gt 0

      - name: Run reg-suit visual regression comparison
        working-directory: frontend
        run: |
          mkdir -p src/__tests__/__screenshots__/actual
          cp -r .maestro/screenshots/*.png src/__tests__/__screenshots__/actual/ 2>/dev/null || true
          if [ -d src/__tests__/__screenshots__/expected ] && \
             [ "$(find src/__tests__/__screenshots__/expected -name '*.png' | wc -l)" -gt 0 ]; then
            npx reg-suit run
          else
            echo "No expected baselines found — skipping reg-suit compare."
            echo "Run 'npm run visual:capture && npm run visual:approve' to seed baselines."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-${{ matrix.device_slug }}-${{ github.sha }}
          path: |
            frontend/.maestro/screenshots/**
            frontend/src/__tests__/__screenshots__/diff/**
            frontend/report.html
            frontend/eas-build-android.json
          if-no-files-found: warn
          retention-days: 30
