appId: ${APP_ID}
---
tags:
  - flagship
  - visual-regression
  - matrix
---
# Visual regression matrix — captures golden routes across theme + font
# scale variants, then asserts each against a committed baseline.
#
# This flow is parameterised by env vars:
#   APP_ID       — bundle/package id
#   PLATFORM     — "ios" | "android" (used in screenshot names)
#   DEVICE       — device slug e.g. "iphone15pro", "iphonese", "pixel8", "pixel5"
#   THEME        — "light" | "dark" (used in screenshot names)
#   FONT_SCALE   — "100" | "130" | "200" (used in screenshot names)
#   THRESHOLD    — thresholdPercentage for assertScreenshot (default 98)
#   VISUAL_MODE  — "capture" | "assert" (default: capture)
#                    capture: takeScreenshot only (baseline seeding)
#                    assert:  takeScreenshot + assertScreenshot (regression check)
#
# Device-level theme and font-scale changes are handled externally by
# scripts/capture-baselines.sh or the CI workflow, which set the device
# configuration via xcrun simctl (iOS) or adb (Android) before each
# invocation of this flow. Maestro flows are declarative YAML and cannot
# run shell commands to change device settings directly.
#
# Screenshot naming convention:
#   {platform}-{device}-{theme}-{scale}-{route}.png
#   e.g. ios-iphone15pro-light-100-home.png
#
# Usage (see scripts/capture-baselines.sh for the full matrix loop):
#   maestro test .maestro/flows/visualRegressionMatrix.yaml \
#     --env APP_ID=$APP_ID \
#     --env PLATFORM=ios \
#     --env DEVICE=iphone15pro \
#     --env THEME=light \
#     --env FONT_SCALE=100 \
#     --env VISUAL_MODE=capture \
#     --test-output-dir=.maestro/screenshots/ios-iphone15pro-light-100

env:
  THRESHOLD: "98"
  VISUAL_MODE: "capture"
  PREFIX: "${PLATFORM}-${DEVICE}-${THEME}-${FONT_SCALE}"

- launchApp:
    clearState: false
    permissions:
      all: allow

- extendedWaitUntil:
    visible:
      id: "home-feed-container"
      optional: true
    timeout: 20000

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: ${PREFIX}-home

- runFlow:
    when:
      true: ${VISUAL_MODE === "assert"}
    commands:
      - assertScreenshot:
          path: ${MAESTRO_LOGS_DIRECTORY}/${PREFIX}-home.png
          thresholdPercentage: ${THRESHOLD}
          cropOn:
            id: "home-feed-container"

- tapOn:
