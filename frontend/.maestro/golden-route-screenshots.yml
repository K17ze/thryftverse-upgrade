      true: ${VISUAL_MODE === "assert"}
    commands:
      - assertScreenshot:
          path: golden-browse-populated.png
          thresholdPercentage: ${THRESHOLD}
          cropOn:
            id: "browse-screen"
# Tap first visible product card to open ItemDetail
- tapOn:
    id: "golden-browse-first-product"
    optional: true
- assertVisible:
