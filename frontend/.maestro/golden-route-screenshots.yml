# Maestro flow — golden-route screenshot capture for visual regression baseline.
#
# Captures first-viewport screenshots of every golden route defined in
# audit 15 §Golden routes and visual-qa-gates.md §3. These screenshots
# form the baseline set for the visual regression test plan
# (src/__tests__/visualRegressionPlan.test.ts).
#
# Prerequisites:
#   - Test build is already past onboarding and auth (see README.md).
#   - App has real or seeded data so screens render in populated state.
#   - For assert mode: baselines must exist in the test-output-dir.
#
# Usage:
#   # Capture mode (baseline seeding — takeScreenshot only)
#   maestro test .maestro/golden-route-screenshots.yml --output .maestro/screenshots/golden-routes
#
#   # Assert mode (regression check — takeScreenshot + assertScreenshot)
#   maestro test .maestro/golden-route-screenshots.yml \
#     --env VISUAL_MODE=assert \
#     --output .maestro/screenshots/golden-routes
#
# After capture, review screenshots and promote to baselines:
#   cp -r .maestro/screenshots/golden-routes src/__tests__/__screenshots__/
#
# Baseline capture process (P0.6):
#   1. Build a development client for the target device.
#   2. Run the flow above on each device in the matrix.
#   3. Review each screenshot against the optical rubric in
#      .devin/visual-qa-gates.md (light/dark parity, hierarchy, media
#      dominance, state coverage).
#   4. On sign-off, promote to baselines:
#        cp -r .maestro/screenshots/golden-routes src/__tests__/__screenshots__/
#   5. Commit the baselines. The visualRegressionPlan.test.ts and
#      check-visual-release-gates.mjs scripts enforce their presence on
#      every subsequent PR — a missing baseline directory is a
#      release-blocking failure, not a soft pass.
#
# Device matrix (run once per device + theme):
#   maestro test --device "iPhone 15" .maestro/golden-route-screenshots.yml
#   maestro test --device "iPhone SE (3rd generation)" .maestro/golden-route-screenshots.yml
#   maestro test --device "Pixel_7_API_33" .maestro/golden-route-screenshots.yml
#
# Audit 15 §Device matrix:
#   - compact iPhone width
#   - regular iPhone
#   - large iPhone
#   - older supported iPhone
#   - mid-range Android
#   - lower-memory Android
#   Each in: light, dark, 100% text, 200% text, reduced motion, poor network.
#
# testID selectors:
#   Key elements on golden route screens expose testID props so Maestro
#   flows use semantic selectors (tapOn id:) instead of brittle coordinate
#   taps (tapOn point:). This makes flows resilient to layout changes.

appId: ${MAESTRO_APP_ID}
env:
  VISUAL_MODE: "capture"
  THRESHOLD: "98"
---
# ── Core: Home ──
- launchApp:
    clearState: false
- assertVisible:
    label: "Home"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: golden-home-populated
- runFlow:
    when:
      true: ${VISUAL_MODE === "assert"}
    commands:
      - assertScreenshot:
          path: golden-home-populated.png
          thresholdPercentage: ${THRESHOLD}
          cropOn:
            id: "home-feed-container"

# ── Core: Search ──
- tapOn:
    label: "Search listings"
- assertVisible:
    text: ".*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: golden-search-idle
- runFlow:
    when:
      true: ${VISUAL_MODE === "assert"}
    commands:
      - assertScreenshot:
          path: golden-search-idle.png
          thresholdPercentage: ${THRESHOLD}
          cropOn:
            id: "search-screen"
- inputText: "vintage denim"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: golden-search-results
- runFlow:
    when:
      true: ${VISUAL_MODE === "assert"}
    commands:
      - assertScreenshot:
          path: golden-search-results.png
          thresholdPercentage: ${THRESHOLD}
          cropOn:
            id: "search-screen"
- clearText
- back

# ── Core: PDP (fixed price) ──
# Navigate to Browse, tap first item to open PDP
- tapOn:
    label: "Explore"
- assertVisible:
    label: "Explore"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: golden-browse-populated
- runFlow:
