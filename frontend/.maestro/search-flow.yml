# Maestro E2E flow — search journey.
#
# Launches the app, opens the Explore/Search surface, types a query
# ("vintage denim") and verifies that results render.
#
# Run: maestro test .maestro/search-flow.yml
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: false

# Open the Explore tab (the search entry point).
- tapOn:
    label: "Explore"
- assertVisible:
    label: "Explore"
    timeout: 5000
- takeScreenshot: search-explore-initial

# Tap the search field to focus the keyboard. The Explore screen exposes a
# search input; fall back to a tap on the search icon if the field is not
# directly labelled.
- tapOn:
    id: "search-input"
- runFlow:
    when:
      notVisible:
        id: "search-input"
    commands:
      - tapOn:
          label: "Search"

# Type the query.
- inputText: "vintage denim"
- takeScreenshot: search-query-typed

# Submit the search (Enter on the keyboard).
- pressKey: Enter

# Verify results appear — assert that *some* content is visible below the
# search bar after the query resolves. A populated results grid renders at
# least one element; an empty state renders the empty graphic. Either way
# the screen must not be blank.
- assertVisible:
    text: ".*"
    timeout: 8000
- takeScreenshot: search-results
