buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/ThryftVideoExport+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name)
    : (project.properties["ThryftVideoExport_" + name] ?: fallback)
}

def getExtOrIntegerDefault(name, fallback) {
  def value = rootProject.ext.has(name) ? rootProject.ext.get(name)
    : (project.properties["ThryftVideoExport_" + name] ?: fallback)
  return value.toInteger()
}

android {
  namespace "com.margelo.nitro.videoexport"

  ndkVersion getExtOrDefault("ndkVersion", "27.1.12297006")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion", 36)

  defaultConfig {
    // Media3 Transformer requires minSdk 21+; aligned with the app's floor.
    minSdkVersion getExtOrIntegerDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion", 36)
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
    prefabPublishing true
  }

  prefab {
    ThryftVideoExport {
      headers "${project.buildDir}/headers/thryftvideoexport/"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // Media3 Transformer — the flagship-grade export pipeline (CapCut/VN
  // equivalent on Android). media3-transformer drives the encode;
  // media3-effect provides SpeedChangeEffect / OverlayEffect /
  // Presentation; media3-muxer is the MP4 writer Transformer's InAppMuxer
  // defaults to.
  def media3Version = "1.8.0"
  implementation "androidx.media3:media3-transformer:$media3Version"
  implementation "androidx.media3:media3-effect:$media3Version"
  implementation "androidx.media3:media3-muxer:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"

  // Nitro Promise.async runs on a coroutine scope.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  // ImmutableList used by the Effects/overlay APIs.
  implementation "com.google.guava:guava:33.4.0-android"
}

tasks.register('prepareHeaders', Copy) {
  from fileTree('./src/main/cpp').filter { it.isFile() }
  from fileTree('../cpp/').filter { it.isFile() }
  from fileTree('../nitrogen/generated/android/c++').filter { it.isFile() }
  from fileTree('../nitrogen/generated/shared/c++').filter { it.isFile() }
  include "*.hpp"
  into "${project.buildDir}/headers/thryftvideoexport/ThryftVideoExport/"
  includeEmptyDirs = false
}

preBuild.dependsOn(prepareHeaders)
