# nginx-tls reverse proxy config — terminates TLS and forwards to the api
# service on port 4000.
#
# !!! LOCAL DEV ONLY !!!
# Uses self-signed certificates generated by
# frontend/scripts/generate-local-spki-hashes.sh. Do NOT use in production.

# Upstream: the api service (plaintext HTTP on port 4000).
upstream thryftverse_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 4443 ssl;
    server_name api.thryftverse.local api.thryftverse.com localhost;

    # Self-signed dev cert (SPKI hash matches the LOCAL DEV pins).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    # Large body limit to match the API's media upload routes.
    client_max_body_size 100m;

    # Serve the dev CA certificate so Android emulators / iOS simulators
    # can install it as a trusted root if needed for local testing.
    location /.well-known/ca {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # Health check passthrough.
    location = /health {
        proxy_pass http://thryftverse_api;
        proxy_set_header Host $host;
    }

    # Default: forward everything to the API.
    location / {
        proxy_pass http://thryftverse_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
