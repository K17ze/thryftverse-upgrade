version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: thryftverse-postgres
    environment:
      POSTGRES_USER: thryftverse
      POSTGRES_PASSWORD: thryftverse
      POSTGRES_DB: thryftverse
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=128MB", "-c", "effective_cache_size=768MB", "-c", "random_page_cost=1.1", "-c", "log_min_duration_statement=1000", "-c", "checkpoint_completion_target=0.9", "-c", "wal_buffers=16MB", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    volumes:
      - thryftverse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thryftverse -d thryftverse"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: thryftverse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── PgBouncer — connection pooling (dev) ─────────────────────────────
  # Sits between the API and PostgreSQL, pooling connections in transaction
  # mode for BullMQ compatibility. The API connects to pgbouncer:6432 when
  # PGBOUNCER_ENABLED=true (src/db/pool.ts rewrites the port automatically).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: thryftverse-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: thryftverse
      DB_PASSWORD: thryftverse
      DB_NAME: thryftverse
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 100
      IGNORE_STARTUP_PARAMETERS: statement_timeout,extra_float_digits,search_path
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: thryftverse-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_URL: http://localhost:4000
      # PgBouncer — pool.ts rewrites the port to 6432 when enabled.
      # DATABASE_URL points at the pgbouncer container; PGBOUNCER_ENABLED
      # also caps the client-side pool_max to 10 (see src/db/pool.ts).
      DATABASE_URL: postgresql://thryftverse:thryftverse@pgbouncer:5432/thryftverse
      MIGRATE_DATABASE_URL: postgresql://thryftverse:thryftverse@postgres:5432/thryftverse
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_PORT: "5432"
      REDIS_URL: redis://redis:6379
      KEY_SERVICE_URL: http://localhost:4100
      KEY_SERVICE_CLIENT_TOKEN: local-key-client-token
      KEY_SERVICE_ADMIN_TOKEN: local-key-admin-token
      # Meilisearch — full-text search
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: local-meilisearch-api-key
      MEILISEARCH_INDEX_PREFIX: thryftverse_
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: thryftverse-media
      S3_FORCE_PATH_STYLE: "true"
      S3_CDN_BASE_URL: http://localhost:9000
      MEDIA_PROCESSING_ENABLED: "false"
      MEDIA_PUBLICATION_GATE_ENABLED: "false"
      DECISION_SERVICE_URL: http://localhost:8000
      DECISION_SERVICE_TIMEOUT_MS: 2500
      DECISION_SERVICE_TOKEN: local-decision-service-token
      AUTH_ACCESS_TOKEN_SECRET: dev-access-token-secret-min-32-chars
      AUTH_REFRESH_TOKEN_SECRET: dev-refresh-token-secret-min-32-chars
      AUTH_ACCESS_TOKEN_TTL_SECONDS: 900
      AUTH_REFRESH_TOKEN_TTL_SECONDS: 2592000
      AUTH_PASSWORD_HASH_COST: 12
      AUTH_EMAIL_PROVIDER: log
      API_SECURITY_ADMIN_TOKEN: local-security-admin-token
      API_RATE_LIMIT_MAX: 140
      API_RATE_LIMIT_WINDOW: "1 minute"
    ports:
      - "4000:4000"
    restart: unless-stopped

  # ── Meilisearch — full-text search engine (dev) ─────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: thryftverse-meilisearch
    environment:
      MEILI_MASTER_KEY: local-meilisearch-master-key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - thryftverse_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  thryftverse_pg_data:
  thryftverse_meili_data:
