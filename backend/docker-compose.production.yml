# ── ThryftVerse production docker-compose ─────────────────────────────
# All secrets MUST be provided via environment variables or a .env file.
# No development defaults are included — every secret is required and
# must be injected by the deployment environment (CI/CD, secrets manager,
# or an explicit .env.production file passed with --env-file).
#
# Usage:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# 2026 container hardening applied to ALL services:
#   read_only, cap_drop ALL, no-new-privileges, non-root user,
#   pids_limit, tmpfs for /tmp, pinned image versions.
#
# Network segmentation:
#   frontend  — public-facing (Caddy only)
#   backend   — internal (api, worker, key-service, meilisearch)
#   db        — internal (postgres, redis, pgbouncer, backup)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 2026 container hardening baseline — merged into every service.
# Services that need exceptions (e.g. cap_add for privileged ports,
# read_only override for runtime package installation) override
# individual keys after the merge.
x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  user: "10001:10001"
  pids_limit: 256

services:
  # ── Caddy — TLS termination reverse proxy (production) ──────────────
  # Terminates TLS, enforces HSTS, and forwards to the api container.
  # Bridges the public frontend network and the internal backend network.
  caddy:
    image: caddy:2.8-alpine
    container_name: thryftverse-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.thryftverse.com}
      CDN_DOMAIN: ${CDN_DOMAIN:-cdn.thryftverse.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *default-security
    # Caddy binds to privileged ports 80/443 — needs NET_BIND_SERVICE
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    networks:
      - frontend
      - backend

  # ── PostgreSQL — primary database (production) ──────────────────────
  # Only on the internal db network. No host port exposure.
  postgres:
    image: postgres:16-alpine
    container_name: thryftverse-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=128MB", "-c", "effective_cache_size=768MB", "-c", "random_page_cost=1.1", "-c", "log_min_duration_statement=1000", "-c", "checkpoint_completion_target=0.9", "-c", "wal_buffers=16MB", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - thryftverse_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-security
    # PostgreSQL needs to chown the data dir and switch to the postgres user.
    # Override user — the entrypoint manages privilege dropping internally.
    user: "70:70"
    # Postgres writes to /var/run/postgresql at runtime
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    mem_limit: 1G
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db

  # ── Redis — cache instance (production) ─────────────────────────────
  # Ephemeral cache, rate limiting, and realtime pub/sub.
  # allkeys-lru eviction is safe here — cache data is disposable.
  redis-cache:
    image: redis:7-alpine
    container_name: thryftverse-redis-cache-prod
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - thryftverse_redis_cache_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-security
    user: "999:999"
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db

  # ── Redis — queue instance (production) ──────────────────────────────
  # Dedicated BullMQ queue broker. AOF persistence ensures jobs survive
  # restarts. noeviction policy prevents job data from being evicted.
  redis-queue:
    image: redis:7-alpine
    container_name: thryftverse-redis-queue-prod
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - thryftverse_redis_queue_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-security
    user: "999:999"
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db

  # ── PgBouncer — connection pooling (production) ─────────────────────
  # Reduces PostgreSQL connection pressure at scale (50+ pods × pool_max).
  # POOL_MODE=transaction is required for BullMQ compatibility.
  # The API and worker connect to pgbouncer:6432 via DATABASE_URL;
  # PGBOUNCER_ENABLED=true caps the client-side pool_max to 10.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: thryftverse-pgbouncer-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 100
      IGNORE_STARTUP_PARAMETERS: statement_timeout,extra_float_digits,search_path
    ports:
      - "127.0.0.1:6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-security
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db

  # ── Key Service — encryption key management (production) ────────────
  key-service:
    build:
      context: ./key-service
      dockerfile: Dockerfile
    container_name: thryftverse-key-service-prod
    environment:
      NODE_ENV: production
      PORT: 4100
      KEY_SERVICE_MASTER_KEY_B64: ${KEY_SERVICE_MASTER_KEY_B64}
      KEY_SERVICE_ALLOWED_KEYS: ${KEY_SERVICE_ALLOWED_KEYS:-profile,message,wallet}
      KEY_SERVICE_CLIENT_TOKEN: ${KEY_SERVICE_CLIENT_TOKEN}
      KEY_SERVICE_ADMIN_TOKEN: ${KEY_SERVICE_ADMIN_TOKEN}
      KEY_SERVICE_DEFAULT_KEY_VERSION: ${KEY_SERVICE_DEFAULT_KEY_VERSION:-1}
      KEY_SERVICE_REGION: ${KEY_SERVICE_REGION}
      KEY_SERVICE_COUNTRY: ${KEY_SERVICE_COUNTRY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-security
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  # ── API — main Fastify application server (production) ──────────────
  # Does NOT expose port 4000 to the host — Caddy proxies traffic.
  # Background workers are disabled here (RUN_BACKGROUND_WORKERS=false);
  # they run in the separate worker container.
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: thryftverse-api-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      key-service:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_PORT: "5432"
      RUN_BACKGROUND_WORKERS: "false"
      RUN_API_SERVER: "true"
      REDIS_URL: redis://redis-cache:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      KEY_SERVICE_URL: http://key-service:4100
      KEY_SERVICE_CLIENT_TOKEN: ${KEY_SERVICE_CLIENT_TOKEN}
      KEY_SERVICE_ADMIN_TOKEN: ${KEY_SERVICE_ADMIN_TOKEN}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MEILISEARCH_INDEX_PREFIX: ${MEILISEARCH_INDEX_PREFIX:-thryftverse_}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL}
      MEDIA_PROCESSING_ENABLED: ${MEDIA_PROCESSING_ENABLED:-true}
      MEDIA_PUBLICATION_GATE_ENABLED: ${MEDIA_PUBLICATION_GATE_ENABLED:-true}
      DECISION_SERVICE_URL: ${DECISION_SERVICE_URL}
      DECISION_SERVICE_TIMEOUT_MS: ${DECISION_SERVICE_TIMEOUT_MS:-2500}
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_TOKEN}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_PASSWORD_HASH_COST: ${AUTH_PASSWORD_HASH_COST:-12}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-resend}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      API_SECURITY_ADMIN_TOKEN: ${API_SECURITY_ADMIN_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-140}
      API_RATE_LIMIT_WINDOW: ${API_RATE_LIMIT_WINDOW:-1 minute}
      USER_RATE_LIMIT_MAX: ${USER_RATE_LIMIT_MAX:-200}
      USER_RATE_LIMIT_WINDOW: ${USER_RATE_LIMIT_WINDOW:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.15}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_HTTP_URL: ${OTEL_EXPORTER_OTLP_HTTP_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_AGENT_DEFAULT_MODEL: ${OPENAI_AGENT_DEFAULT_MODEL:-gpt-5.6-terra}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      WISE_API_KEY: ${WISE_API_KEY:-}
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET:-}
      ONEZE_ATTESTATION_SIGNING_SECRET: ${ONEZE_ATTESTATION_SIGNING_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SIGHTENGINE_API_KEY: ${SIGHTENGINE_API_KEY:-}
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      LIVE_STREAM_PROVIDER: ${LIVE_STREAM_PROVIDER:-mock}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    <<: *default-security
    mem_limit: 1G
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
      - db

  # ── Worker — standalone BullMQ worker process (production) ──────────
  # Runs heavy background jobs (push notifications, auction sweeps, outbox
  # drain, reconciliation) without the API server so they never block the
  # API event loop. Scales independently from the API service.
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: thryftverse-worker-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      key-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_PORT: "5432"
      RUN_BACKGROUND_WORKERS: "true"
      RUN_API_SERVER: "false"
      REDIS_URL: redis://redis-cache:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      KEY_SERVICE_URL: http://key-service:4100
      KEY_SERVICE_CLIENT_TOKEN: ${KEY_SERVICE_CLIENT_TOKEN}
      KEY_SERVICE_ADMIN_TOKEN: ${KEY_SERVICE_ADMIN_TOKEN}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MEILISEARCH_INDEX_PREFIX: ${MEILISEARCH_INDEX_PREFIX:-thryftverse_}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL}
      MEDIA_PROCESSING_ENABLED: ${MEDIA_PROCESSING_ENABLED:-true}
      MEDIA_PUBLICATION_GATE_ENABLED: ${MEDIA_PUBLICATION_GATE_ENABLED:-true}
      DECISION_SERVICE_URL: ${DECISION_SERVICE_URL}
      DECISION_SERVICE_TIMEOUT_MS: ${DECISION_SERVICE_TIMEOUT_MS:-2500}
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_TOKEN}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_PASSWORD_HASH_COST: ${AUTH_PASSWORD_HASH_COST:-12}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-resend}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      API_SECURITY_ADMIN_TOKEN: ${API_SECURITY_ADMIN_TOKEN}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-140}
      API_RATE_LIMIT_WINDOW: ${API_RATE_LIMIT_WINDOW:-1 minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.15}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_HTTP_URL: ${OTEL_EXPORTER_OTLP_HTTP_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_AGENT_DEFAULT_MODEL: ${OPENAI_AGENT_DEFAULT_MODEL:-gpt-5.6-terra}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      WISE_API_KEY: ${WISE_API_KEY:-}
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET:-}
      ONEZE_ATTESTATION_SIGNING_SECRET: ${ONEZE_ATTESTATION_SIGNING_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SIGHTENGINE_API_KEY: ${SIGHTENGINE_API_KEY:-}
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      LIVE_STREAM_PROVIDER: ${LIVE_STREAM_PROVIDER:-mock}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    command: ["sh", "-c", "npm run worker:start"]
    healthcheck:
      # Check if the node worker process is alive.
      # node:20-alpine has no pgrep, but busybox ps is available.
      test: ["CMD-SHELL", "ps | grep -q '[w]orkers/index' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    <<: *default-security
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
      - db

  # ── Meilisearch — full-text search engine (production) ──────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: thryftverse-meilisearch-prod
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: ${MEILISEARCH_MAX_INDEXING_MEMORY:-2048}
    volumes:
      - thryftverse_meili_data_prod:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-security
    # Meilisearch needs to write to its data directory and temp space
    tmpfs:
      - /tmp
      - /meili_tmp
    mem_limit: 2G
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  # ── Backup sidecar — encrypted PostgreSQL backups to S3 (production) ─
  # Runs cron daily at 02:00 UTC. Creates a compressed, encrypted pg_dump
  # and uploads it to S3 with 30-day retention.
  # NOTE: read_only is disabled because the container installs packages
  # (postgresql-client, aws-cli, openssl, dcron) at startup. All other
  # hardening (cap_drop, no-new-privileges, pids_limit, mem_limit) applies.
  backup:
    image: alpine:3.20
    container_name: thryftverse-backup-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      S3_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_REGION: ${AWS_REGION:-}
      ALERTING_WEBHOOK_URL: ${ALERTING_WEBHOOK_URL:-}
    volumes:
      - ./scripts/automated-backup.sh:/usr/local/bin/backup.sh:ro
      - thryftverse_backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache postgresql-client aws-cli curl openssl findutils coreutils dcron

        chmod +x /usr/local/bin/backup.sh

        # Parse DATABASE_URL into POSTGRES_* vars expected by the backup script
        POSTGRES_HOST="$$(echo "$$DATABASE_URL" | sed -n 's|^.*://[^@]*@\([^:]*\):.*|\1|p')"
        POSTGRES_PORT="$$(echo "$$DATABASE_URL" | sed -n 's|^.*:\([0-9]*\)/.*|\1|p')"
        POSTGRES_USER="$$(echo "$$DATABASE_URL" | sed -n 's|^.*://\([^:]*\):.*|\1|p')"
        POSTGRES_PASSWORD="$$(echo "$$DATABASE_URL" | sed -n 's|^.*://[^:]*:\([^@]*\)@.*|\1|p')"
        POSTGRES_DB="$$(echo "$$DATABASE_URL" | sed -n 's|^.*:\([0-9]*\)/\([^?]*\).*|\2|p')"

        # Export vars for the backup script
        export POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
        export S3_BACKUP_BUCKET="$$S3_BUCKET"
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$$S3_SECRET_ACCESS_KEY"
        export AWS_REGION="$$S3_REGION"

        # Write crontab — daily at 02:00 UTC
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root

        echo "[$$(date -u)] Backup sidecar started. Daily backup at 02:00 UTC."
        echo "[$$(date -u)] DATABASE_URL parsed: host=$$POSTGRES_HOST port=$$POSTGRES_PORT db=$$POSTGRES_DB"

        # Run crond in the foreground
        crond -f -l 8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # read_only disabled — runtime package installation requires writable filesystem
    read_only: false
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db

# ── Named volumes ─────────────────────────────────────────────────────
volumes:
  thryftverse_pg_data_prod:
  thryftverse_redis_cache_data_prod:
  thryftverse_redis_queue_data_prod:
  thryftverse_meili_data_prod:
  caddy_data:
  caddy_config:
  thryftverse_backup_data:

# ── Network segmentation ──────────────────────────────────────────────
# frontend  — public-facing network (Caddy only, bridges to backend)
# backend   — application network (api, worker, key-service, meilisearch)
#             NOT internal:true — api/worker need outbound internet access
#             for Stripe, OpenAI, Resend, Sentry, etc.
# db        — internal network for data services (postgres, redis, pgbouncer, backup)
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  db:
    driver: bridge
    internal: true
