# ── ThryftVerse production override ───────────────────────────────────
# Applied on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d
#
# Adds: Caddy TLS termination, backup sidecar, standalone worker.
# Applies 2026 container hardening to ALL services:
#   read_only, cap_drop ALL, no-new-privileges, non-root user,
#   pids_limit, tmpfs for /tmp, pinned image versions.
#
# Network segmentation:
#   frontend  — public-facing (Caddy only)
#   backend   — internal (api, worker, key-service, ml-service, minio)
#   db        — internal (postgres, redis, pgbouncer, backup)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 2026 container hardening baseline — merged into every service.
x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  user: "10001:10001"
  pids_limit: 256

services:
  # ── Caddy — TLS termination reverse proxy (production) ──────────────
  # Terminates TLS, enforces HSTS, and forwards to the api container.
  # Bridges the public frontend network and the internal backend network.
  caddy:
    image: caddy:2.8-alpine
    container_name: thryftverse-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./backend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.thryftverse.com}
      CDN_DOMAIN: ${CDN_DOMAIN:-cdn.thryftverse.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *default-security
    # Caddy binds to privileged ports 80/443 — needs NET_BIND_SERVICE
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256M
    logging: *default-logging
    networks:
      - frontend
      - backend

  # ── PostgreSQL — override for production ─────────────────────────────
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    <<: *default-security
    # PostgreSQL needs to chown the data dir and switch to the postgres user.
    # Override user — the entrypoint manages privilege dropping internally.
    user: "70:70"
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    mem_limit: 2G
    logging: *default-logging
    networks:
      - db

  # ── Redis — cache instance override for production ───────────────────
  redis:
    image: redis:7-alpine
    container_name: thryftverse-redis-cache-prod
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    <<: *default-security
    user: "999:999"
    mem_limit: 512M
    logging: *default-logging
    networks:
      - db

  # ── Redis — queue instance for production ────────────────────────────
  redis-queue:
    image: redis:7-alpine
    container_name: thryftverse-redis-queue-prod
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - thryftverse_redis_queue_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-security
    user: "999:999"
    mem_limit: 512M
    logging: *default-logging
    networks:
      - db

  # ── PgBouncer — override for production ──────────────────────────────
  # Updates dev defaults with production credentials and hardening.
  pgbouncer:
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 100
      IGNORE_STARTUP_PARAMETERS: statement_timeout,extra_float_digits,search_path
    ports:
      - "127.0.0.1:6432:5432"
    <<: *default-security
    mem_limit: 256M
    logging: *default-logging
    networks:
      - db

  # ── MinIO — override for production ──────────────────────────────────
  minio:
    # Neutralize the "9000:9000"/"9001:9001" host ports from the base file —
    # object storage is reached over the backend network only. External S3
    # clients go through the public S3_PUBLIC_ENDPOINT.
    ports: !reset []
    <<: *default-security
    # MinIO needs writable temp space beyond /tmp
    tmpfs:
      - /tmp
      - /.minio
    mem_limit: 1G
    logging: *default-logging
    networks:
      - backend

  # ── MinIO init — one-shot bucket bootstrap (production) ──────────────
  # The api blocks on service_completed_successfully; without a network
  # attachment the job sits on the implicit default network and can never
  # reach minio (backend) — the whole stack would hang at startup.
  minio-init:
    logging: *default-logging
    networks:
      - backend

  # ── Key Service — override for production ────────────────────────────
  key-service:
    # Neutralize the "4100:4100" host port from the base file — the token
    # service is internal-only; api/worker reach it over the backend network.
    ports: !reset []
    <<: *default-security
    mem_limit: 512M
    logging: *default-logging
    networks:
      - backend

  # ── Meilisearch — override for production ────────────────────────────
  # Without this override the base service lands on the implicit default
  # network (unreachable from api/worker, which sit on backend+db) and
  # publishes 7700 to the host with a dev master-key default.
  meilisearch:
    # Neutralize the "7700:7700" host port — internal index only.
    ports: !reset []
    environment:
      MEILI_ENV: production
      # Required — api/worker read the same value via the MEILISEARCH_KEY
      # fallback chain below, so a single env var keeps both sides in sync.
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
    <<: *default-security
    # Meilisearch writes index data to its volume and scratch to /meili_tmp.
    tmpfs:
      - /tmp
      - /meili_tmp
    mem_limit: 2G
    logging: *default-logging
    networks:
      - backend

  # ── API — override for production ────────────────────────────────────
  # Does NOT expose port 4000 to the host — Caddy proxies traffic.
  # `ports: []` alone would NOT clear the inherited "4000:4000" mapping
  # (Compose concatenates port sequences on merge); !reset empties it.
  # Background workers are disabled here (RUN_BACKGROUND_WORKERS=false);
  # they run in the separate worker container.
  api:
    ports: !reset []
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_PORT: "5432"
      NODE_ENV: production
      RUN_BACKGROUND_WORKERS: "false"
      RUN_API_SERVER: "true"
      # requiredSecret()s — the base compose file supplies dev defaults
      # (KEY_SERVICE_*, API_*_TOKEN, DECISION_SERVICE_TOKEN) or empty strings
      # (PAYMENT_METADATA_HMAC_SECRET) which would silently ship a prod
      # container with known dev credentials, and unset secrets
      # (ENCRYPTION_KEY, AUTH_*) which crash the API at boot. Re-declare them
      # all as required here so `docker compose` fails fast at parse time.
      KEY_SERVICE_CLIENT_TOKEN: ${KEY_SERVICE_CLIENT_TOKEN:?KEY_SERVICE_CLIENT_TOKEN is required}
      KEY_SERVICE_ADMIN_TOKEN: ${KEY_SERVICE_ADMIN_TOKEN:?KEY_SERVICE_ADMIN_TOKEN is required}
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_TOKEN:?DECISION_SERVICE_TOKEN is required}
      API_SECURITY_ADMIN_TOKEN: ${API_SECURITY_ADMIN_TOKEN:?API_SECURITY_ADMIN_TOKEN is required}
      API_INTERNAL_SERVICE_TOKEN: ${API_INTERNAL_SERVICE_TOKEN:?API_INTERNAL_SERVICE_TOKEN is required}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?AUTH_ACCESS_TOKEN_SECRET is required}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:?AUTH_REFRESH_TOKEN_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PAYMENT_METADATA_HMAC_SECRET: ${PAYMENT_METADATA_HMAC_SECRET:?PAYMENT_METADATA_HMAC_SECRET is required}
      ONEZE_ATTESTATION_SIGNING_SECRET: ${ONEZE_ATTESTATION_SIGNING_SECRET:?ONEZE_ATTESTATION_SIGNING_SECRET is required}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required}
      # Search — this process serves /search. Canonical var is
      # MEILISEARCH_KEY; MEILISEARCH_API_KEY is accepted as a legacy alias.
      # MEILISEARCH_MASTER_KEY is last in the fallback chain so setting only
      # the server-side name keeps the meilisearch service and the api in
      # sync (the server requires it when MEILI_ENV=production).
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-${MEILISEARCH_API_KEY:-${MEILISEARCH_MASTER_KEY:-}}}
      MEILISEARCH_INDEX: ${MEILISEARCH_INDEX:-listings}
      # assertProductionReadiness (src/lib/productionReadiness.ts) refuses to
      # boot a production api without every one of these. The base file either
      # omits them or ships dev defaults (http://10.0.2.2, minioadmin,
      # sandbox_kyc_vendor, MEDIA_*=false) that the readiness gate rejects —
      # re-declare them required so `docker compose` fails at parse time.
      APP_URL: ${APP_URL:?APP_URL is required}
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL:?S3_CDN_BASE_URL is required}
      MEDIA_PROCESSING_ENABLED: ${MEDIA_PROCESSING_ENABLED:?MEDIA_PROCESSING_ENABLED is required}
      MEDIA_PUBLICATION_GATE_ENABLED: ${MEDIA_PUBLICATION_GATE_ENABLED:?MEDIA_PUBLICATION_GATE_ENABLED is required}
      KYC_DEFAULT_VENDOR: ${KYC_DEFAULT_VENDOR:?KYC_DEFAULT_VENDOR is required}
      KYC_RETURN_URL: ${KYC_RETURN_URL:?KYC_RETURN_URL is required}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET:?KYC_WEBHOOK_SECRET is required}
      # Vendor-conditional KYC creds — required only for the chosen
      # KYC_DEFAULT_VENDOR; pass through so any supported vendor can be used.
      PERSONA_API_KEY: ${PERSONA_API_KEY:-}
      PERSONA_TEMPLATE_ID: ${PERSONA_TEMPLATE_ID:-}
      PERSONA_WEBHOOK_SECRET: ${PERSONA_WEBHOOK_SECRET:-}
      ONFIDO_API_KEY: ${ONFIDO_API_KEY:-}
      ONFIDO_WEBHOOK_TOKEN: ${ONFIDO_WEBHOOK_TOKEN:-}
      ONEZE_FX_SYNC_ENABLED: ${ONEZE_FX_SYNC_ENABLED:?ONEZE_FX_SYNC_ENABLED is required}
      ONEZE_FX_PROVIDER_URL: ${ONEZE_FX_PROVIDER_URL:?ONEZE_FX_PROVIDER_URL is required}
      ONEZE_FX_PROVIDER_API_KEY: ${ONEZE_FX_PROVIDER_API_KEY:?ONEZE_FX_PROVIDER_API_KEY is required}
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:?MODERATION_PROVIDER is required}
      # Moderation provider credentials — conditional pass-throughs (same
      # convention as payment/shipping vendors): which set is required
      # depends on MODERATION_PROVIDER, and boot-time validation in
      # moderationService.ts fails fast when the selected provider's creds
      # are absent. sightengine → SIGHTENGINE_API_USER + SIGHTENGINE_API_KEY;
      # rekognition → AWS_* trio (and is image-only — rejected as the sole
      # provider since text moderation needs a text-capable provider).
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      SIGHTENGINE_API_KEY: ${SIGHTENGINE_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ALERTING_WEBHOOK_URLS: ${ALERTING_WEBHOOK_URLS:?ALERTING_WEBHOOK_URLS is required}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      # Payment provider pass-throughs — readiness requires at least one
      # complete set; which vendor is a deployment choice.
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_SECRET: ${MOLLIE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
      TAP_SECRET_KEY: ${TAP_SECRET_KEY:-}
      TAP_WEBHOOK_SECRET: ${TAP_WEBHOOK_SECRET:-}
      # Shipping provider pass-throughs — readiness requires at least one
      # complete set (key + base URL + webhook secret, EASYSHIP has no URL).
      EVRI_API_KEY: ${EVRI_API_KEY:-}
      EVRI_API_BASE_URL: ${EVRI_API_BASE_URL:-}
      EVRI_WEBHOOK_SECRET: ${EVRI_WEBHOOK_SECRET:-}
      DELHIVERY_API_KEY: ${DELHIVERY_API_KEY:-}
      DELHIVERY_API_BASE_URL: ${DELHIVERY_API_BASE_URL:-}
      DELHIVERY_WEBHOOK_SECRET: ${DELHIVERY_WEBHOOK_SECRET:-}
      DHL_API_KEY: ${DHL_API_KEY:-}
      DHL_API_BASE_URL: ${DHL_API_BASE_URL:-}
      DHL_WEBHOOK_SECRET: ${DHL_WEBHOOK_SECRET:-}
      ARAMEX_API_KEY: ${ARAMEX_API_KEY:-}
      ARAMEX_API_BASE_URL: ${ARAMEX_API_BASE_URL:-}
      ARAMEX_WEBHOOK_SECRET: ${ARAMEX_WEBHOOK_SECRET:-}
      EASYSHIP_API_KEY: ${EASYSHIP_API_KEY:-}
      EASYSHIP_WEBHOOK_SECRET: ${EASYSHIP_WEBHOOK_SECRET:-}
    <<: *default-security
    mem_limit: 2G
    logging: *default-logging
    networks:
      - backend
      - db

  # ── Worker — standalone BullMQ worker process (production) ──────────
  # Runs heavy background jobs (push notifications, auction sweeps, outbox
  # drain, reconciliation) without the API server so they never block the
  # API event loop. Scales independently from the API service.
  worker:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: thryftverse-worker-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      key-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_PORT: "5432"
      RUN_BACKGROUND_WORKERS: "true"
      RUN_API_SERVER: "false"
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      # Search — this process runs the scheduled blue/green reindex
      # (search_indexing queue). Canonical var is MEILISEARCH_KEY;
      # MEILISEARCH_API_KEY is accepted as a legacy alias by the API.
      # MEILISEARCH_MASTER_KEY is last in the fallback chain so setting only
      # the server-side name keeps client and server credentials in sync.
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-${MEILISEARCH_API_KEY:-${MEILISEARCH_MASTER_KEY:-}}}
      MEILISEARCH_INDEX: ${MEILISEARCH_INDEX:-listings}
      KEY_SERVICE_URL: http://key-service:4100
      KEY_SERVICE_CLIENT_TOKEN: ${KEY_SERVICE_CLIENT_TOKEN:?KEY_SERVICE_CLIENT_TOKEN is required}
      KEY_SERVICE_ADMIN_TOKEN: ${KEY_SERVICE_ADMIN_TOKEN:?KEY_SERVICE_ADMIN_TOKEN is required}
      API_SECURITY_ADMIN_TOKEN: ${API_SECURITY_ADMIN_TOKEN:?API_SECURITY_ADMIN_TOKEN is required}
      API_INTERNAL_SERVICE_TOKEN: ${API_INTERNAL_SERVICE_TOKEN:?API_INTERNAL_SERVICE_TOKEN is required}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_FORCE_PATH_STYLE: "true"
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL:?S3_CDN_BASE_URL is required}
      MEDIA_PROCESSING_ENABLED: ${MEDIA_PROCESSING_ENABLED:?MEDIA_PROCESSING_ENABLED is required}
      MEDIA_PUBLICATION_GATE_ENABLED: ${MEDIA_PUBLICATION_GATE_ENABLED:?MEDIA_PUBLICATION_GATE_ENABLED is required}
      DECISION_SERVICE_URL: http://ml-service:8000
      DECISION_SERVICE_TIMEOUT_MS: 2500
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_TOKEN:?DECISION_SERVICE_TOKEN is required}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?AUTH_ACCESS_TOKEN_SECRET is required}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:?AUTH_REFRESH_TOKEN_SECRET is required}
      # requiredSecret()s with no env wiring would crash the worker at boot.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PAYMENT_METADATA_HMAC_SECRET: ${PAYMENT_METADATA_HMAC_SECRET:?PAYMENT_METADATA_HMAC_SECRET is required}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-resend}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-140}
      API_RATE_LIMIT_WINDOW: ${API_RATE_LIMIT_WINDOW:-1 minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.15}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_HTTP_URL: ${OTEL_EXPORTER_OTLP_HTTP_URL:-}
      AUCTION_SWEEP_INTERVAL_MS: ${AUCTION_SWEEP_INTERVAL_MS:-30000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_AGENT_DEFAULT_MODEL: ${OPENAI_AGENT_DEFAULT_MODEL:-gpt-5.6-terra}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WISE_API_KEY: ${WISE_API_KEY:-}
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      ONEZE_ATTESTATION_SIGNING_SECRET: ${ONEZE_ATTESTATION_SIGNING_SECRET:?ONEZE_ATTESTATION_SIGNING_SECRET is required}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      ALERTING_WEBHOOK_URLS: ${ALERTING_WEBHOOK_URLS:?ALERTING_WEBHOOK_URLS is required}
      # The worker imports config.ts, so assertProductionReadiness applies
      # here too — without these the worker crashes at boot in production.
      APP_URL: ${APP_URL:?APP_URL is required}
      KYC_DEFAULT_VENDOR: ${KYC_DEFAULT_VENDOR:?KYC_DEFAULT_VENDOR is required}
      KYC_RETURN_URL: ${KYC_RETURN_URL:?KYC_RETURN_URL is required}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET:?KYC_WEBHOOK_SECRET is required}
      PERSONA_API_KEY: ${PERSONA_API_KEY:-}
      PERSONA_TEMPLATE_ID: ${PERSONA_TEMPLATE_ID:-}
      PERSONA_WEBHOOK_SECRET: ${PERSONA_WEBHOOK_SECRET:-}
      ONFIDO_API_KEY: ${ONFIDO_API_KEY:-}
      ONFIDO_WEBHOOK_TOKEN: ${ONFIDO_WEBHOOK_TOKEN:-}
      ONEZE_FX_SYNC_ENABLED: ${ONEZE_FX_SYNC_ENABLED:?ONEZE_FX_SYNC_ENABLED is required}
      ONEZE_FX_PROVIDER_URL: ${ONEZE_FX_PROVIDER_URL:?ONEZE_FX_PROVIDER_URL is required}
      ONEZE_FX_PROVIDER_API_KEY: ${ONEZE_FX_PROVIDER_API_KEY:?ONEZE_FX_PROVIDER_API_KEY is required}
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:?MODERATION_PROVIDER is required}
      # Moderation provider credentials — conditional pass-throughs; boot
      # validation (moderationService.ts) fails fast when the selected
      # provider's creds are absent. rekognition is image-only and rejected
      # as the sole provider (text moderation needs a text-capable provider).
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      SIGHTENGINE_API_KEY: ${SIGHTENGINE_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_SECRET: ${MOLLIE_WEBHOOK_SECRET:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
      TAP_SECRET_KEY: ${TAP_SECRET_KEY:-}
      TAP_WEBHOOK_SECRET: ${TAP_WEBHOOK_SECRET:-}
      EVRI_API_KEY: ${EVRI_API_KEY:-}
      EVRI_API_BASE_URL: ${EVRI_API_BASE_URL:-}
      EVRI_WEBHOOK_SECRET: ${EVRI_WEBHOOK_SECRET:-}
      DELHIVERY_API_KEY: ${DELHIVERY_API_KEY:-}
      DELHIVERY_API_BASE_URL: ${DELHIVERY_API_BASE_URL:-}
      DELHIVERY_WEBHOOK_SECRET: ${DELHIVERY_WEBHOOK_SECRET:-}
      DHL_API_KEY: ${DHL_API_KEY:-}
      DHL_API_BASE_URL: ${DHL_API_BASE_URL:-}
      DHL_WEBHOOK_SECRET: ${DHL_WEBHOOK_SECRET:-}
      ARAMEX_API_KEY: ${ARAMEX_API_KEY:-}
      ARAMEX_API_BASE_URL: ${ARAMEX_API_BASE_URL:-}
      ARAMEX_WEBHOOK_SECRET: ${ARAMEX_WEBHOOK_SECRET:-}
      EASYSHIP_API_KEY: ${EASYSHIP_API_KEY:-}
      EASYSHIP_WEBHOOK_SECRET: ${EASYSHIP_WEBHOOK_SECRET:-}
      # Backup-store inventory for the backup-expiry worker (GDPR erasure
      # propagation verification — backupExpiryHandler). When unset the
      # handler refuses to mark manifest entries purged instead of guessing.
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-db-backups}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-${AWS_REGION:-}}
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT:-}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
    command: ["sh", "-c", "npm run worker:start"]
    healthcheck:
      # Check if the node worker process is alive.
      # node:20-alpine has no pgrep, but busybox ps is available.
      test: ["CMD-SHELL", "ps | grep -q '[w]orkers/index' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    <<: *default-security
    mem_limit: 1g
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    logging: *default-logging
    networks:
      - backend
      - db

  # ── ML Service — override for production ─────────────────────────────
  ml-service:
    # Neutralize the "8000:8000" host port published by the base compose —
    # the decision service is reachable only on the internal backend network.
    # `ports: []` alone would NOT clear the inherited mapping (Compose merges
    # port sequences); !reset explicitly empties the list.
    ports: !reset []
    environment:
      # ENV=production makes ADMIN_SERVICE_TOKEN / DECISION_SERVICE_TOKEN
      # mandatory in app/main.py — no dev token defaults in production.
      ENV: production
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?ADMIN_SERVICE_TOKEN is required}
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_TOKEN:?DECISION_SERVICE_TOKEN is required}
    <<: *default-security
    mem_limit: 1G
    logging: *default-logging
    networks:
      - backend

  # ── Backup sidecar — encrypted PostgreSQL backups to S3 (production) ─
  # Runs cron daily at 02:00 UTC. Creates a compressed, encrypted pg_dump
  # and uploads it to S3 with 30-day retention.
  # NOTE: read_only is disabled because the container installs packages
  # (postgresql-client, aws-cli, openssl, dcron) at startup. All other
  # hardening (cap_drop, no-new-privileges, pids_limit, mem_limit) applies.
  # The named volume at /backups is the writable scratch/output dir; the
  # backup script itself stays mounted read-only and is invoked via `bash`
  # (installed deliberately below — the alpine image ships only busybox sh).
  backup:
    image: alpine:3.20
    container_name: thryftverse-backup-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "30"
      # Encryption and an upload destination are REQUIRED — an unencrypted
      # dump or a backup with nowhere to go is a silent data-loss vector.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
      S3_BUCKET: ${S3_BACKUP_BUCKET:?S3_BACKUP_BUCKET is required}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-db-backups}
      S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      S3_REGION: ${AWS_REGION:?AWS_REGION is required}
      ALERTING_WEBHOOK_URL: ${ALERTING_WEBHOOK_URL:-}
    volumes:
      - ./backend/scripts/automated-backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # bash is installed deliberately — automated-backup.sh has a bash
        # shebang and uses pipefail; alpine ships only busybox sh.
        apk add --no-cache postgresql-client aws-cli curl openssl findutils coreutils dcron bash

        # No chmod here: backup.sh is mounted read-only (chmod would fail
        # under `set -e` anyway) and is invoked through the interpreter.

        # Parse DATABASE_URL into POSTGRES_* vars expected by the backup script
        POSTGRES_HOST="$$(echo "$$DATABASE_URL" | sed -n 's|^.*://[^@]*@\([^:]*\):.*|\1|p')"
        POSTGRES_PORT="$$(echo "$$DATABASE_URL" | sed -n 's|^.*:\([0-9]*\)/.*|\1|p')"
        POSTGRES_USER="$$(echo "$$DATABASE_URL" | sed -n 's|^.*://\([^:]*\):.*|\1|p')"
        POSTGRES_PASSWORD="$$(echo "$$DATABASE_URL" | sed -n 's|^.*://[^:]*:\([^@]*\)@.*|\1|p')"
        POSTGRES_DB="$$(echo "$$DATABASE_URL" | sed -n 's|^.*:\([0-9]*\)/\([^?]*\).*|\2|p')"

        # Fail fast on an unparseable DATABASE_URL instead of letting cron
        # discover empty credentials at 02:00.
        if [ -z "$$POSTGRES_HOST" ] || [ -z "$$POSTGRES_USER" ] || [ -z "$$POSTGRES_DB" ]; then
          echo "FATAL: could not parse DATABASE_URL into POSTGRES_* vars" >&2
          exit 1
        fi

        # Export vars for the backup script
        export POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
        export S3_BACKUP_BUCKET="$$S3_BUCKET"
        export S3_BACKUP_PREFIX
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$$S3_SECRET_ACCESS_KEY"
        export AWS_REGION="$$S3_REGION"

        # Write crontab — daily at 02:00 UTC. The script is invoked through
        # bash so the read-only mount's exec bit is irrelevant.
        echo "0 2 * * * bash /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root

        echo "[$$(date -u)] Backup sidecar started. Daily backup at 02:00 UTC."
        echo "[$$(date -u)] DATABASE_URL parsed: host=$$POSTGRES_HOST port=$$POSTGRES_PORT db=$$POSTGRES_DB"

        # Run crond in the foreground
        crond -f -l 8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # read_only disabled — runtime package installation requires writable filesystem
    read_only: false
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512M
    logging: *default-logging
    networks:
      # db (internal) reaches postgres; backend is the egress-capable network
      # for apk installs, S3 upload, and the alerting webhook — an internal-only
      # attachment makes every one of those calls fail.
      - db
      - backend

# ── Named volumes (production additions) ──────────────────────────────
volumes:
  caddy_data:
  caddy_config:
  backup_data:
  thryftverse_redis_queue_data_prod:

# ── Network segmentation ──────────────────────────────────────────────
# frontend  — public-facing network (Caddy only, bridges to backend)
# backend   — application network (api, worker, key-service, ml-service, minio)
#             NOT internal:true — api/worker need outbound internet access
#             for Stripe, OpenAI, Resend, Sentry, etc.
# db        — internal network for data services (postgres, redis, pgbouncer, backup)
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  db:
    driver: bridge
    internal: true
